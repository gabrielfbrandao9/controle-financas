<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5a73">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <script>
    // Tema escolhido (claro/escuro) aplicado antes de desenhar a página, para não piscar.
    try {
      var t = localStorage.getItem('financas:tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* sem armazenamento */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Minhas Finanças</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#/inicio" aria-label="Início">
        <span class="logo" data-logo aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Finanças</strong>
          <small>Controle do dinheiro</small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Seções">
        <a href="#/inicio" data-route="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg>
          <span>Início</span>
        </a>
        <a href="#/lancamentos" data-route="lancamentos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h11M8 12h11M8 17.5h11"/><path d="M4.5 6.5h0M4.5 12h0M4.5 17.5h0"/></svg>
          <span>Lançamentos</span>
        </a>
        <a href="#/investir" data-route="investir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16.5 5.5-5.5 4 4L20 8.5"/><path d="M15 8.5h5v5"/></svg>
          <span>Investir</span>
        </a>
        <a href="#/ajustes" data-route="ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Ajustes</span>
        </a>
      </nav>

      <div class="top-right">
        <button type="button" class="btn primary install-btn" id="btnInstall" data-app-apk hidden>Instalar app</button>
        <button type="button" class="icon theme-btn" id="btnTheme" aria-label="Mudar para o modo escuro" title="Mudar para o modo escuro">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <a class="icon ajustes-topo" href="#/ajustes" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
        <a class="user" id="account" href="#/ajustes" title="Conta e sincronização"></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

  </div>

  <!-- Formulários (montados pelo app.js) -->
  <dialog id="dlg">
    <form method="dialog" class="dlg" id="dlgForm" novalidate></form>
  </dialog>

  <input type="file" id="restaurarInput" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/mercado.js"></script>
  <script src="js/app.js"></script>
  <script src="js/app-apk.js" data-repo="controle-financas" data-apk="MinhasFinancas.apk"></script>
</body>
</html>
